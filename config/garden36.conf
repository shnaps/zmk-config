CONFIG_ZMK_SLEEP=y

# nice!view with bongo cat (dsifry/nice-view-mod, shield nice_view_custom).
# The module defaults the status screen to ZMK_DISPLAY_STATUS_SCREEN_CUSTOM.
# Do not set CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN here -- it replaces the
# bongo cat screen with the stock ZMK one.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Bongo cat speeds up with typing speed, so keep the WPM graph on.
# CONFIG_ZMK_WPM_GRAPH_ENABLED=n


# Milliseconds of inactivity before entering idle state	
# CONFIG_ZMK_IDLE_TIMEOUT=600000
# Milliseconds of inactivity before entering deep sleep
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=180000
# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y
