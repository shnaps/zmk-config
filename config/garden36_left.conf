# Left half only (central). ZMK loads garden36.conf first, then this file.

# ZMK Studio talks over the USB side, which is the central half. Building it
# into the peripheral costs flash and does nothing.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y

# Report the right half's battery level to the host. Both symbols live inside
# `if ZMK_SPLIT_ROLE_CENTRAL`, so setting them on the peripheral only warns.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Screen: bongo cat instead of Luna the dog. The cat's speed follows WPM.
# The module shows Luna first when both are on.
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y
